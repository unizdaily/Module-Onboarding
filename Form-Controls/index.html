<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name"  required minlength="3" />
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name"  required minlength="3" />
        <label for="email">Email</label>
        <input type="email" id="email" name="email"  required />
        <fieldset>
          <legend>Choose a colour</legend>
          <input type="radio" id="color-baby-pink" name="color" value="baby-pink" required />
          <label for="color-baby-pink">Baby Pink</label>
          <input type="radio" id="color-powder-blue" name="color" value="powder-blue" required />
          <label for="color-powder-blue">Powder Blue</label>
          <input type="radio" id="color-mint-green" name="color" value="mint-green" required />
          <label for="color-mint-green">Mint Green</label>
        </fieldset>
        
      </form>
    </main>
    <footer>
      <!-- change to your name-->
      <h2>By HOMEWORK SOLUTION</h2>
    </footer>
  </body>
</html>
